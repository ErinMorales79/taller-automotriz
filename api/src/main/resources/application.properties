# La configuración real (secreto del token, puerto) va en config/api.properties, que no se sube a Git.
spring.config.import=optional:file:./config/api.properties,optional:file:../config/api.properties
spring.application.name=taller-api
server.port=8080
# Los errores no deben mostrar rutas internas ni trazas al cliente.
server.error.include-message=never
server.error.include-stacktrace=never
