plugins {
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

evaluationDependsOn(':nucleo')

dependencies {
    implementation project(':nucleo')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.auth0:java-jwt:4.4.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Las pruebas de la API reutilizan la base de pruebas con rollback de nucleo.
    testImplementation project(':nucleo').sourceSets.test.output
}

tasks.named('test') {
    systemProperty 'taller.bd.nombre', 'taller_automotriz_test'
}
